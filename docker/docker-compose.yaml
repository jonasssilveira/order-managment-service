version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_managment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  flyway:
    image: flyway/flyway:latest
    container_name: flyway_migrator
    command:
      -url=jdbc:postgresql://postgres:5432/
      -schemas=public
      -user=postgres
      -password=postgres
      -connectRetries=60
      migrate
    volumes:
      - ../database/migration:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network
networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data: